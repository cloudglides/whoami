version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      nextjs:
        patterns:
          - "next*"
          - "@next*"
        update-types:
          - "minor"
          - "patch"
      react:
        patterns:
          - "react*"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"
      prisma:
        patterns:
          - "@prisma*"
          - "prisma"
        update-types:
          - "minor"
          - "patch"
      auth:
        patterns:
          - "next-auth*"
          - "@auth*"
        update-types:
          - "minor"
          - "patch"
      tailwind:
        patterns:
          - "tailwindcss*"
          - "@tailwindcss*"
        update-types:
          - "minor"
          - "patch"
      ui:
        patterns:
          - "lucide-react"
          - "motion"
        update-types:
          - "minor"
          - "patch"
      zod:
        patterns:
          - "zod"
        update-types:
          - "minor"
          - "patch"
      sentry:
        patterns:
          - "@sentry*"
        update-types:
          - "minor"
          - "patch"
      redis:
        patterns:
          - "@upstash*"
        update-types:
          - "minor"
          - "patch"
      pino:
        patterns:
          - "pino*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "github-actions"
      - "dependencies"
    commit-message:
      prefix: "chore(github-actions)"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "docker"
      - "dependencies"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"